{% extends 'base.html' %}

{% block content %}
    <div class="page-title"><h2>Delete product</h2></div>
    <div class="panel">
        <p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, delete</button>
            <a class="btn btn-outline" href="{% url 'product_detail' product.id %}">Cancel</a>
        </form>
    </div>
{% endblock %}
