{% extends 'base.html' %}

{% block content %}
    <h2>Products</h2>
    <a href="{% url 'add_product' %}">Add product</a>
    <ul>
        {% for p in products %}
            <li>{{ p.name }} - KES {{ p.price }} (stock: {{ p.stock }})</li>
        {% empty %}
            <li>No products yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
