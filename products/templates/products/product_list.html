{% extends 'base.html' %}

{% block content %}
    <div class="page-head page-title">
        <h2>Products</h2>
        <a class="btn btn-outline" href="{% url 'add_product' %}">Add product</a>
    </div>
    <div class="grid">
        {% for p in products %}
            <article class="card">
                <div class="card-img">{{ p.name|first|upper }}</div>
                <div class="card-body">
                    <h3>{{ p.name }}</h3>
                    <p class="price">KES {{ p.price }}</p>
                    <p class="stock">{% if p.stock > 0 %}In stock{% else %}Out of stock{% endif %}</p>
                    <form method="post" action="{% url 'add_to_cart' p.id %}">
                        {% csrf_token %}
                        <button type="submit" {% if p.stock == 0 %}disabled{% endif %}>Add to cart</button>
                    </form>
                </div>
            </article>
        {% empty %}
            <p>No products yet.</p>
        {% endfor %}
    </div>
{% endblock %}
