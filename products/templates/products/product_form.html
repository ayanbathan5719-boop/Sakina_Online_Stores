{% extends 'base.html' %}

{% block content %}
    <div class="page-title"><h2>{{ title }}</h2></div>
    <div class="panel">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
            <a class="btn btn-outline" href="{% url 'product_list' %}">Cancel</a>
        </form>
    </div>
{% endblock %}
