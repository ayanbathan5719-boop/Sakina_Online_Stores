{% extends 'base.html' %}

{% block content %}
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <p>
                {{ field.label_tag }} {{ field }}
                {% for error in field.errors %}
                    <br><small style="color:red">{{ error }}</small>
                {% endfor %}
            </p>
        {% endfor %}
        <p><button type="submit">Create account</button></p>
    </form>
{% endblock %}
